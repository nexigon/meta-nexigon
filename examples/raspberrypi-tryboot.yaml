# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/refs/heads/master/kas/schema-kas.json
#
# Builds a Raspberry Pi image with Nexigon Agent and Rugix A/B updates.

header:
  version: 14
  includes:
    - examples/include/rugix.yaml

local_conf_header:
  raspberrypi: |
    DISTRO_FEATURES:append = " bluez5 bluetooth wifi "
    IMAGE_INSTALL:append = " bluez5 i2c-tools"
    ENABLE_UART = "1"
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"

  image-conf: |
    # Image ID used to identify the correct update artifacts.
    IMAGE_ID = "example-rpi-rugix"
    # Filesystem types including the Rugix update bundle.
    IMAGE_FSTYPES = "tar.bz2 wic wic.xz wic.bmap rugixb rugixb.hash"
    # Override the A/B system partition size (default: 4GiB).
    # RUGIX_SYSTEM_SIZE = "4GiB"

machine: raspberrypi-armv8
distro: poky
target:
  - core-image-minimal

repos:
  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi.git
    branch: wrynose

  meta-rugix:
    url: https://github.com/rugix/meta-rugix.git
    commit: 6235d8ccc92036d36d4e6d527c9b470b7574e8e7
    layers:
      meta-rugix-core:
      meta-rugix-rpi-tryboot:

  meta-nexigon:
    layers:
      meta-nexigon-core:
      meta-nexigon-rugix:
