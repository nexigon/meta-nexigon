# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/refs/heads/master/kas/schema-kas.json
#
# Builds a QEMU x86_64 image with Nexigon Agent and Rugix A/B updates.

header:
  version: 14
  includes:
    - examples/include/rugix.yaml

local_conf_header:
  image-conf: |
    # Image ID used to identify the correct update artifacts.
    IMAGE_ID = "example-qemu-x86_64-rugix"
    # Filesystem types including the Rugix update bundle.
    IMAGE_FSTYPES = "tar.bz2 wic wic.xz wic.bmap rugixb rugixb.hash"
    # Size of each A/B system partition. On first boot, Rugix adds the second
    # one and a data partition that fills the rest of the disk.
    RUGIX_SYSTEM_SIZE = "2560MiB"
    # Build OVMF firmware for QEMU pflash.
    EXTRA_IMAGEDEPENDS += "ovmf"

machine: qemux86-64
distro: poky
target:
  - core-image-minimal

repos:
  meta-rugix:
    url: https://github.com/rugix/meta-rugix.git
    commit: a1b83978c774fab61f5b56b63f4af09773bae07c
    layers:
      meta-rugix-core:
      meta-rugix-qemu-x86_64-grub:

  meta-nexigon:
    layers:
      meta-nexigon-core:
      meta-nexigon-rugix:
