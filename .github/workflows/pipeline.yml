name: CI Pipeline

on:
  push:
    branches: [main]
    # Release tags are timestamps, such as 20261029100000.
    tags: ["[0-9]+"]
  pull_request:
    branches: [main]

# The builds share one runner. A new commit cancels the previous build of a pull
# request, while every build of main runs to publish its images.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  KAS_CONTAINER_ENGINE: podman
  KAS_WORK_DIR: ${{ github.workspace }}/_kas
  KAS_BUILD_DIR: ${{ github.workspace }}/build

jobs:
  build:
    name: Build
    runs-on: [self-hosted, si-xlarge]
    environment: staging
    strategy:
      matrix:
        include:
          - config: examples/qemu-x86_64-rauc.yaml
            machine: qemux86-64
          - config: examples/qemu-x86_64-rugix.yaml
            machine: qemux86-64
          - config: examples/raspberrypi-tryboot.yaml
            machine: raspberrypi-armv8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tag builds use the tag as their version.
      - name: Set IMAGE_VERSION
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "IMAGE_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "IMAGE_VERSION=build-$(date +%Y%m%d%H%M%S)-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          fi

      # The secrets hold shared development keys, so that bundles of different
      # builds install on each other's images. Without them, for example on
      # forks, the build signs with throwaway keys.
      - name: Set up RAUC keys
        if: contains(matrix.config, 'rauc')
        env:
          RAUC_DEV_CA_CERT: ${{ secrets.RAUC_DEV_CA_CERT }}
          RAUC_DEV_SIGNING_CERT: ${{ secrets.RAUC_DEV_SIGNING_CERT }}
          RAUC_DEV_SIGNING_KEY: ${{ secrets.RAUC_DEV_SIGNING_KEY }}
        run: |
          if [ -z "$RAUC_DEV_CA_CERT$RAUC_DEV_SIGNING_CERT$RAUC_DEV_SIGNING_KEY" ]; then
            echo "::warning::RAUC_DEV_* secrets are not set, signing with throwaway keys"
          fi
          mise run generate-rauc-keys

      - name: Build
        run: mise run build ${{ matrix.config }}:.github/kas/ci.yaml

      # Builds of main and tags publish the QEMU images with their SBOMs to the
      # staging instance of Nexigon Hub, as package yocto-<example> with a locked
      # build tag. Builds of main also move the floating tag latest-build-main.
      - name: Publish to staging
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && contains(matrix.config, 'qemu')
        env:
          NEXIGON_HUB_URL: ${{ vars.NEXIGON_HUB_URL }}
          NEXIGON_TOKEN: ${{ secrets.NEXIGON_STAGING_TOKEN }}
          NEXIGON_OTA_REPOSITORY: ${{ vars.NEXIGON_STAGING_REPOSITORY }}
          CONFIG: ${{ matrix.config }}
          MACHINE: ${{ matrix.machine }}
        run: |
          curl -fsSL https://install.nexigon.dev/download-cli.sh | USE_MUSL=true sh
          (umask 077 && printf 'hub-url = "%s"\ntoken = "%s"\n' "$NEXIGON_HUB_URL" "$NEXIGON_TOKEN" > .nexigon-cli.toml)
          export NEXIGON_CLI=./nexigon-cli
          export NEXIGON_OTA_PACKAGE="yocto-$(basename "$CONFIG" .yaml)"
          floating_tag=""
          if [ "$GITHUB_REF_TYPE" = branch ]; then
            floating_tag=latest-build-main
          fi
          BUILD_TAG="$IMAGE_VERSION" FLOATING_TAG="$floating_tag" mise run prepare-release
          mise run upload-release "$MACHINE"

      # Tag builds collect the image, update bundle, SBOM, and VEX document of
      # each example for the GitHub release.
      - name: Collect release artifacts
        if: github.ref_type == 'tag'
        run: ./scripts/collect-release.sh ${{ matrix.machine }} dist

      - name: Upload release artifacts
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ strategy.job-index }}
          path: dist/
          if-no-files-found: error
          compression-level: 0

      - name: Remove credentials and RAUC keys
        if: always()
        run: rm -rf rauc-keys .nexigon-cli.toml .release.env

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(dist/*)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --verify-tag \
              --notes "Example images built from $GITHUB_SHA, with the SPDX 3 SBOM and the VEX document of sbom-cve-check for each image."
          fi
