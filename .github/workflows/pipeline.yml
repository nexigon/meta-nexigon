name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The builds share one runner. A new commit cancels the previous build of a pull
# request, while every build of main runs to publish its images.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KAS_CONTAINER_ENGINE: podman
  KAS_WORK_DIR: ${{ github.workspace }}/_kas
  KAS_BUILD_DIR: ${{ github.workspace }}/build

jobs:
  build:
    name: Build
    runs-on: [self-hosted, nixos, yocto]
    environment: staging
    strategy:
      matrix:
        config:
          - examples/qemu-x86_64-rauc.yaml
          - examples/qemu-x86_64-rugix.yaml
          - examples/raspberrypi-tryboot.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set IMAGE_VERSION
        run: echo "IMAGE_VERSION=build-$(date +%Y%m%d%H%M%S)-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # The secrets hold shared development keys, so that bundles of different
      # builds install on each other's images. Without them, for example on
      # forks, the build signs with throwaway keys.
      - name: Set up RAUC keys
        if: contains(matrix.config, 'rauc')
        env:
          RAUC_DEV_CA_CERT: ${{ secrets.RAUC_DEV_CA_CERT }}
          RAUC_DEV_SIGNING_CERT: ${{ secrets.RAUC_DEV_SIGNING_CERT }}
          RAUC_DEV_SIGNING_KEY: ${{ secrets.RAUC_DEV_SIGNING_KEY }}
        run: |
          if [ -z "$RAUC_DEV_CA_CERT$RAUC_DEV_SIGNING_CERT$RAUC_DEV_SIGNING_KEY" ]; then
            echo "::warning::RAUC_DEV_* secrets are not set, signing with throwaway keys"
          fi
          mise run generate-rauc-keys

      - name: Build
        run: mise run build ${{ matrix.config }}

      # Builds of main publish the QEMU images to the staging instance of Nexigon
      # Hub, as package yocto-<example> with a locked build tag and the floating
      # tag latest-build-main.
      - name: Publish to staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(matrix.config, 'qemu')
        env:
          NEXIGON_HUB_URL: ${{ vars.NEXIGON_HUB_URL }}
          NEXIGON_TOKEN: ${{ secrets.NEXIGON_STAGING_TOKEN }}
          NEXIGON_OTA_REPOSITORY: ${{ vars.NEXIGON_STAGING_REPOSITORY }}
          CONFIG: ${{ matrix.config }}
        run: |
          curl -fsSL https://install.nexigon.dev/download-cli.sh | USE_MUSL=true sh
          (umask 077 && printf 'hub-url = "%s"\ntoken = "%s"\n' "$NEXIGON_HUB_URL" "$NEXIGON_TOKEN" > .nexigon-cli.toml)
          export NEXIGON_CLI=./nexigon-cli
          export NEXIGON_OTA_PACKAGE="yocto-$(basename "$CONFIG" .yaml)"
          BUILD_TAG="$IMAGE_VERSION" FLOATING_TAG=latest-build-main mise run prepare-release
          mise run upload-release qemux86-64

      - name: Remove credentials and RAUC keys
        if: always()
        run: rm -rf rauc-keys .nexigon-cli.toml .release.env
