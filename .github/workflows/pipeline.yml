name: CI Pipeline

on:
  push:
    branches: [main]
    # Release tags are timestamps, such as 20261029100000.
    tags: ["[0-9]+"]
  pull_request:
    branches: [main]

# New commits cancel earlier PR pipelines. Keep running main pipelines intact
# while they publish their images.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  KAS_CONTAINER_ENGINE: podman
  KAS_WORK_DIR: ${{ github.workspace }}/_kas
  KAS_BUILD_DIR: ${{ github.workspace }}/build

jobs:
  prepare-build:
    name: Prepare Build Metadata
    runs-on: ubuntu-latest
    outputs:
      image-version: ${{ steps.metadata.outputs.image-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test release artifact handoff
        run: python3 scripts/test-release-artifacts.py

      - name: Set image version
        id: metadata
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            version="build-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA:0:7}"
          fi
          echo "image-version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    runs-on: [self-hosted, si-xlarge]
    # Shared RAUC development signing keys are scoped to this environment.
    environment: staging
    needs: prepare-build
    env:
      IMAGE_VERSION: ${{ needs.prepare-build.outputs.image-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: qemu-x86_64-rauc
            machine: qemux86-64
          - example: qemu-x86_64-rugix
            machine: qemux86-64
          - example: raspberrypi-tryboot
            machine: raspberrypi-armv8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The secrets hold shared development keys, so that bundles of different
      # builds install on each other's images. Without them, for example on
      # forks, the build signs with throwaway keys.
      - name: Set up RAUC keys
        if: contains(matrix.example, 'rauc')
        env:
          RAUC_DEV_CA_CERT: ${{ secrets.RAUC_DEV_CA_CERT }}
          RAUC_DEV_SIGNING_CERT: ${{ secrets.RAUC_DEV_SIGNING_CERT }}
          RAUC_DEV_SIGNING_KEY: ${{ secrets.RAUC_DEV_SIGNING_KEY }}
        run: |
          if [ -z "$RAUC_DEV_CA_CERT$RAUC_DEV_SIGNING_CERT$RAUC_DEV_SIGNING_KEY" ]; then
            echo "::warning::RAUC_DEV_* secrets are not set, signing with throwaway keys"
          fi
          mise run generate-rauc-keys

      - name: Build
        run: mise run build examples/${{ matrix.example }}.yaml:.github/kas/ci.yaml

      - name: Collect build artifacts
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          ./scripts/collect-release.sh "$MACHINE" dist
          cp "build/tmp/deploy/images/$MACHINE/os-release" dist/os-release

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.example }}
          path: dist/
          if-no-files-found: error
          compression-level: 0

      - name: Remove RAUC keys
        if: always()
        run: rm -rf rauc-keys

  publish-staging:
    name: Publish to Nexigon Staging
    runs-on: [self-hosted, si-small]
    needs: [prepare-build, build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: qemu-x86_64-rauc
            machine: qemux86-64
          - example: qemu-x86_64-rugix
            machine: qemux86-64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ matrix.example }}
          path: dist

      - name: Install Nexigon CLI
        run: curl -fsSL https://install.nexigon.dev/download-cli.sh | USE_MUSL=true sh

      - name: Publish to staging
        env:
          NEXIGON_HUB_URL: ${{ vars.NEXIGON_HUB_URL }}
          NEXIGON_TOKEN: ${{ secrets.NEXIGON_STAGING_TOKEN }}
          NEXIGON_OTA_REPOSITORY: ${{ vars.NEXIGON_STAGING_REPOSITORY }}
          NEXIGON_OTA_PACKAGE: yocto-${{ matrix.example }}
          BUILD_TAG: ${{ needs.prepare-build.outputs.image-version }}
          MACHINE: ${{ matrix.machine }}
        run: |
          (umask 077 && printf 'hub-url = "%s"\ntoken = "%s"\n' "$NEXIGON_HUB_URL" "$NEXIGON_TOKEN" > .nexigon-cli.toml)
          export NEXIGON_CLI=./nexigon-cli
          floating_tag=""
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            floating_tag=latest-build-main
          fi
          FLOATING_TAG="$floating_tag" mise run prepare-release
          mise run upload-release "$MACHINE" dist

      - name: Remove credentials
        if: always()
        run: rm -f .nexigon-cli.toml .release.env

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find dist -maxdepth 1 -type f ! -name os-release -print0)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --verify-tag \
              --notes "Example images built from $GITHUB_SHA, with the SPDX 3 SBOM and the VEX document of sbom-cve-check for each image."
          fi
