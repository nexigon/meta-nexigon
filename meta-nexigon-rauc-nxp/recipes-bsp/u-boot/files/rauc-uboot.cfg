# The boot script writes the boot counters to the FAT partition.
CONFIG_CMD_FAT=y
CONFIG_FAT_WRITE=y

# The demo does not update U-Boot, so disable EFI capsule updates. NXP's
# configuration enables them with authentication, which requires efitools from
# NXP's SDK layer.
# CONFIG_EFI_CAPSULE_ON_DISK is not set
# CONFIG_EFI_RUNTIME_UPDATE_CAPSULE is not set
# CONFIG_EFI_CAPSULE_AUTHENTICATE is not set
